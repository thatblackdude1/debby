<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>For My Love ❤️</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family: 'Poppins', sans-serif;
    }

    body{
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        overflow:hidden;
        background: linear-gradient(135deg, #ff4d6d, #ff758f, #ff8fa3);
    }

    .container{
        text-align:center;
        color:white;
        padding:40px;
        border-radius:25px;
        backdrop-filter: blur(10px);
        background: rgba(255,255,255,0.12);
        box-shadow: 0 0 30px rgba(255,255,255,0.25);
        animation: fadeIn 2s ease;
        width:90%;
        max-width:700px;
    }

    h1{
        font-size:3rem;
        margin-bottom:20px;
    }

    #message{
        font-size:1.3rem;
        line-height:1.8;
        min-height:120px;
    }

    .heart{
        position:absolute;
        color:white;
        font-size:20px;
        animation: float 6s linear infinite;
        opacity:0.7;
    }

    button{
        margin-top:25px;
        padding:12px 28px;
        border:none;
        border-radius:30px;
        background:white;
        color:#ff4d6d;
        font-size:1rem;
        cursor:pointer;
        transition:0.3s;
        font-weight:bold;
    }

    button:hover{
        transform:scale(1.1);
        background:#ffe5ec;
    }

    @keyframes float{
        0%{
            transform:translateY(100vh) scale(0);
        }
        100%{
            transform:translateY(-10vh) scale(1.5);
        }
    }

    @keyframes fadeIn{
        from{
            opacity:0;
            transform:translateY(20px);
        }
        to{
            opacity:1;
            transform:translateY(0);
        }
    }
</style>
</head>
<body>

<div class="container">
    <h1>❤️ To My GEE ❤️</h1>
    <p id="message"></p>

    <button onclick="showLove()">
        Click Me ✨
    </button>
</div>

<script>
    const text = "No matter where life takes us, you’ll always have a special place in my heart. Every moment with you feels magical even though we are not always together, and every smile of yours brightens my world even though I don't see them often. ❤️ - Promise";

    let i = 0;

    function typeWriter() {
        if (i < text.length) {
            document.getElementById("message").innerHTML += text.charAt(i);
            i++;
            setTimeout(typeWriter, 45);
        }
    }

    typeWriter();

    function showLove(){
        alert("I love you to the moon, Debby ❤️");
    }

    // Floating hearts
    function createHeart(){
        const heart = document.createElement("div");
        heart.classList.add("heart");
        heart.innerHTML = "❤";

        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = Math.random() * 20 + 15 + "px";
        heart.style.animationDuration = Math.random() * 3 + 3 + "s";

        document.body.appendChild(heart);

        setTimeout(()=>{
            heart.remove();
        },6000);
    }

    setInterval(createHeart, 300);
</script>
<audio autoplay loop>
    <source src="song.mp3" type="audio/mpeg">
</audio>

</body>
</html>
